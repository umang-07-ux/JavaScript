<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #212121;">
    0	UNSENT	Client has been created. open() not called yet.
1	OPENED	open() has been called.
2	HEADERS_RECEIVED	send() has been called, and headers and status are available.
3	LOADING	Downloading; responseText holds partial data.
4	DONE	The operation is complete.
</body>
<script>
    // API ka URL jahan se data lena hai (GitHub par Hitesh ka profile data)
    const requestUrl = 'https://api.github.com/users/hiteshchoudhary'

    // Naya XMLHttpRequest object banaya. Ye server se baat karne wala "messenger" hai
    const xhr = new XMLHttpRequest();

    // Request ready ki: GET matlab "data do", aur URL bata diya. Abhi bheji nahi hai
    xhr.open('GET', requestUrl)

    // Jab bhi request ki state (readyState) badlegi, ye function chalega
    xhr.onreadystatechange = function(){

        // Abhi ki state print karo (number: 0 se 4)
        console.log(xhr.readyState);

        // 4 matlab DONE. Pura data aa chuka hai, tabhi aage badho
        if (xhr.readyState === 4) {

            // Server text (string) bhejta hai. JSON.parse usko JS object bana deta hai
            // this = xhr (yahan dono same hain)
            const data = JSON.parse(this.responseText)

            // "object" print hoga, yani data ab object ban gaya
            console.log(typeof data);

            // Object me se followers ki ginti print karo
            console.log(data.followers);
        }
    }

    // Ab request server ko bhej do. Isi line par asli kaam shuru hota hai
    xhr.send();
</script>
</html>

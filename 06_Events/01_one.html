    // Removing images by clicking on it-
    document.querySelector('#images').addEventListener('click',function(e) {
        console.log(e.target.parentNode); //Target the parent node.

        console.log(e.target.tagName);
        // Agar hum directly removeIt ko remove karte hai toh apart from images kahi aur click karegne toh sab kich remove ho jaa raha hai uske liye hum if ka use karenge.
        if(e.target.tagName==='IMG') { //tagName is us tag ka name mil jaata hai.
            console.log(e.target.id);
            let removeIt=e.target.parentNode;
            removeIt.remove(); //This will remove the images by clicking on it.
        }
    },false)

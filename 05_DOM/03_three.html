<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
</body>
<script>
    //Creating a new element using JS.
    const div = document.createElement('div') //This provide different elements of html like here it has provided div
    console.log(div);  //O/P-<div></div>
    div.className="main"
    div.id=Math.round(Math.random() * 10 + 1)
    div.setAttribute("title","generated title")
    div.style.backgroundColor="green"
    div.style.padding="12px"
    // div.innerText="Chai Aur Code" //THis is not prefer as it first brings the value then overwrite it.

    //This whole provides a text in the div here and is more optimize way than the innerText.
    const addText = document.createTextNode("Chai Aur Code")
    div.appendChild(addText)
    //Till above, creation toh ho raha tha par woh body mei nhi attach tha balki sirf ek jagah memory mei save tha.

    //Attaching it to the document
    document.body.appendChild(div)
    
</script>
</html>
